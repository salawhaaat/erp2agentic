<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="640" viewBox="0 0 1340 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1340" height="640" fill="#ffffff"/>
  <text x="24" y="24" font-size="13" fill="#334155">Sweetgreen order &amp; payment flow · IE-GY 9113B Lab 1 process map, sharpened Week 4</text>

  <!-- diagram frame -->
  <rect x="16" y="38" width="1308" height="494" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>

  <!-- lane separators -->
  <line x1="16" y1="161" x2="1324" y2="161" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="16" y1="284" x2="1324" y2="284" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="16" y1="407" x2="1324" y2="407" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="38" x2="120" y2="532" stroke="#e2e8f0" stroke-width="1"/>

  <!-- lane labels -->
  <text x="26" y="103" font-size="11.5" font-weight="700" fill="#475569">Customer</text>
  <text x="26" y="226" font-size="11.5" font-weight="700" fill="#475569">Ordering &amp;</text>
  <text x="26" y="240" font-size="11.5" font-weight="700" fill="#475569">Payment</text>
  <text x="26" y="349" font-size="11.5" font-weight="700" fill="#475569">Kitchen &amp;</text>
  <text x="26" y="363" font-size="11.5" font-weight="700" fill="#475569">Pickup Staff</text>
  <text x="26" y="463" font-size="11.5" font-weight="700" fill="#475569">Staff Handling</text>
  <text x="26" y="477" font-size="11.5" font-weight="700" fill="#475569">Exceptions</text>

  <!-- ============ CUSTOMER ROW ============ -->
  <rect x="165" y="76" width="130" height="46" rx="4" fill="#fde3cf" stroke="#c2410c" stroke-width="1.6"/>
  <text x="230" y="95" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c2d12">Select items,</text>
  <text x="230" y="110" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c2d12">submit order</text>

  <rect x="1120" y="76" width="130" height="46" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="1185" y="104" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">Collect order</text>

  <!-- ============ SYSTEMS ROW ============ -->
  <rect x="165" y="200" width="120" height="44" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="225" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Process payment</text>

  <polygon points="385,198 445,222 385,246 325,222" fill="#fde3cf" stroke="#c2410c" stroke-width="1.6"/>
  <text x="385" y="219" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c2d12">Accepted?</text>
  <text x="385" y="232" text-anchor="middle" font-size="9.5" fill="#7c2d12">(D1)</text>
  <text x="385" y="188" text-anchor="middle" font-size="13" fill="#c2410c">◆</text>

  <rect x="305" y="256" width="155" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="382" y="272" text-anchor="middle" font-size="9.5" fill="#475569">no → notify, order not placed</text>

  <text x="545" y="192" text-anchor="middle" font-size="14" fill="#b7791f">★</text>
  <rect x="480" y="200" width="150" height="44" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="555" y="219" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Confirm order</text>
  <text x="555" y="233" text-anchor="middle" font-size="9.5" fill="#1e3a8a">CP1 · data born</text>

  <text x="1185" y="192" text-anchor="middle" font-size="14" fill="#b7791f">★</text>
  <rect x="1110" y="200" width="150" height="44" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="1185" y="219" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Record completion</text>
  <text x="1185" y="233" text-anchor="middle" font-size="9.5" fill="#1e3a8a">CP4</text>

  <rect x="1140" y="256" width="90" height="26" rx="13" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="1185" y="273" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">Completed</text>

  <!-- ============ KITCHEN ROW ============ -->
  <rect x="480" y="318" width="145" height="44" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="552" y="337" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Review spec &amp;</text>
  <text x="552" y="351" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">availability</text>

  <polygon points="750,310 830,340 750,370 670,340" fill="#fde3cf" stroke="#c2410c" stroke-width="1.6"/>
  <text x="750" y="333" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c2d12">Feasible?</text>
  <text x="750" y="346" text-anchor="middle" font-size="9" fill="#7c2d12">live vs. cached (D2)</text>
  <text x="750" y="300" text-anchor="middle" font-size="13" fill="#c2410c">◆</text>
  <text x="750" y="390" text-anchor="middle" font-size="9.5" font-style="italic" fill="#b91c1c">⚡ stale cache disagrees (curveball)</text>

  <rect x="900" y="318" width="130" height="44" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="965" y="344" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">Prepare meal</text>

  <polygon points="1110,310 1180,340 1110,370 1040,340" fill="#fde3cf" stroke="#c2410c" stroke-width="1.6"/>
  <text x="1110" y="333" text-anchor="middle" font-size="10" font-weight="700" fill="#7c2d12">Matches</text>
  <text x="1110" y="346" text-anchor="middle" font-size="9.5" fill="#7c2d12">order?</text>
  <text x="1110" y="300" text-anchor="middle" font-size="13" fill="#c2410c">◆</text>
  <text x="1110" y="390" text-anchor="middle" font-size="9.5" font-style="italic" fill="#b91c1c">⚡ ① worst friction</text>

  <!-- ============ EXCEPTIONS ROW ============ -->
  <rect x="650" y="438" width="145" height="44" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.4"/>
  <text x="722" y="457" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">Hold &amp; assess</text>
  <text x="722" y="471" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">options</text>

  <polygon points="880,430 960,460 880,490 800,460" fill="#fde3cf" stroke="#c2410c" stroke-width="1.6"/>
  <text x="880" y="453" text-anchor="middle" font-size="10" font-weight="700" fill="#7c2d12">Recovery</text>
  <text x="880" y="466" text-anchor="middle" font-size="10" font-weight="700" fill="#7c2d12">agreed? (D3)</text>
  <text x="880" y="420" text-anchor="middle" font-size="13" fill="#c2410c">◆</text>

  <text x="1085" y="428" text-anchor="middle" font-size="14" fill="#b7791f">★</text>
  <rect x="1020" y="438" width="155" height="44" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
  <text x="1097" y="457" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c4a6e">Record cancel &amp;</text>
  <text x="1097" y="471" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c4a6e">resolve payment</text>
  <text x="1097" y="484" text-anchor="middle" font-size="9" fill="#0c4a6e">CP3 / CP5 / CP6</text>

  <text x="1000" y="502" text-anchor="middle" font-size="9.5" font-style="italic" fill="#b91c1c">⚡ goodwill refund (Cost)</text>

  <rect x="1040" y="504" width="100" height="24" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="1090" y="520" text-anchor="middle" font-size="9.5" fill="#475569">Order canceled</text>

  <!-- ============ ARROWS: forward flow ============ -->
  <path d="M230,122 L230,200" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="285" y1="222" x2="323" y2="222" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="445" y1="222" x2="478" y2="216" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="462" y="206" text-anchor="middle" font-size="9" fill="#166534">yes</text>
  <path d="M405,246 L382,254" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  <text x="405" y="256" text-anchor="middle" font-size="9" fill="#334155">no</text>

  <path d="M555,244 L555,280 L552,318" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="625" y1="340" x2="668" y2="340" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="830" y1="340" x2="898" y2="340" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="864" y="331" text-anchor="middle" font-size="9" fill="#166534">yes</text>
  <line x1="1030" y1="340" x2="1038" y2="340" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- quality yes -> up to collect order -->
  <path d="M1180,325 L1300,325 L1300,99 L1252,99" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1306" y="215" font-size="9" fill="#166534" transform="rotate(90,1306,215)">yes: pack &amp; hand over</text>

  <!-- collect order -> record completion -->
  <path d="M1185,122 L1185,198" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- record completion -> completed -->
  <path d="M1185,244 L1185,254" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- feasible no -> hold & assess -->
  <path d="M750,370 L750,407 L722,436" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="770" y="410" text-anchor="middle" font-size="9" fill="#b91c1c">no</text>

  <!-- quality no -> hold & assess (dashed red rejection path) -->
  <path d="M1110,370 Q1110,415 800,443" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="990" y="415" text-anchor="middle" font-size="9" fill="#b91c1c">no: reject → rework → re-serve late</text>

  <!-- hold -> recovery diamond -->
  <line x1="795" y1="460" x2="798" y2="460" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- recovery agreed (change) -> dashed red curve back to Review spec box (kitchen re-entry) -->
  <path d="M880,430 Q880,270 630,318" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="800" y="275" text-anchor="middle" font-size="9" fill="#b91c1c">agrees to change → re-enter kitchen review</text>

  <!-- recovery no/cancel -> record cancel -->
  <line x1="960" y1="460" x2="1018" y2="460" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="989" y="452" text-anchor="middle" font-size="9" fill="#334155">no agreement / cancel</text>

  <path d="M1097,482 L1097,502" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ LEGEND ============ -->
  <text x="26" y="558" font-size="10.5" fill="#334155">
    <tspan fill="#b7791f" font-weight="700">★</tspan> control point — data is born ·
    <tspan fill="#c2410c" font-weight="700">◆</tspan> decision point — routing choice ·
    <tspan fill="#b91c1c">- - -</tspan> rejection / rework path ·
    <tspan fill="#b91c1c">⚡</tspan> value leak (Four Lenses)
  </text>
  <text x="26" y="578" font-size="10.5" font-style="italic" fill="#64748b">Matches the control register and diagnostic points in the Lab 1 process map and the Week 4 RPA-candidate scan — a mirror, not a template.</text>
</svg>
